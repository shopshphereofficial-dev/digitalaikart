name: Upload Data Analyst Career Kit to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reportlab
        run: pip install reportlab==5.0.1

      - name: Build PDF (deterministic)
        run: |
          mkdir -p downloads
          python3 products/data-analyst-career-kit-2026/build.py

      - name: Sanity-check the build
        run: |
          test -s downloads/data-analyst-career-kit-2026.pdf
          test "$(wc -c < downloads/data-analyst-career-kit-2026.pdf)" -gt 20000
          sha256sum downloads/data-analyst-career-kit-2026.pdf

      - name: Attach PDF to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload data-analyst-career-kit-2026-v1 downloads/data-analyst-career-kit-2026.pdf --repo shopshphereofficial-dev/digitalaikart --clobber

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/data-analyst-career-kit-2026.pdf
          git commit -m "Add Data Analyst Career Starter Kit PDF to repo" || echo "No changes to commit"
          git push
