name: Site fixes (UTILITYNEST entity + broken links/images)

# 1. Makes UTILITYNEST (the registered MSME / Udyam entity) the clearly stated
#    operating entity on every page: footer entity line, both support numbers,
#    About link, copyright line, and an operator paragraph on the policy pages.
# 2. Repairs broken site bits: blog covers that pointed at an empty
#    /assets/og/ URL, three product covers that were never uploaded, and the
#    dead /privacy.html, /refund.html and /contact.html links.
# Safe to re-run — everything in tools/site_fixes.py is idempotent.

on:
  push:
    branches: [main]
    paths:
      - "tools/site_fixes.py"
      - ".github/workflows/site-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply site fixes
        run: python3 tools/site_fixes.py .

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to change — site already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "legal: state UTILITYNEST as operating entity + fix broken links and covers"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
