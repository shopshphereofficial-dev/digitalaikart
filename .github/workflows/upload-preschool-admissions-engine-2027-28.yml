name: Upload Preschool Admissions Engine PDF to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ebook from release
        run: |
          mkdir -p downloads
          gh release download preschool-admissions-engine-2027-28-v1 --repo shopshphereofficial-dev/digitalaikart --output "downloads/preschool-admissions-engine-2027-28.pdf"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/preschool-admissions-engine-2027-28.pdf
          git commit -m "Add Preschool Admissions Engine PDF to repo" || echo "No changes to commit"
          git push
