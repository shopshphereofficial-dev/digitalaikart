name: Upload New Labour Codes 2026 Salary Guide to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ebook from release
        run: |
          mkdir -p downloads
          gh release download new-labour-codes-2026-salary-guide-v1 --repo shopshphereofficial-dev/digitalaikart --output "downloads/new-labour-codes-2026-salary-guide.pdf"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/new-labour-codes-2026-salary-guide.pdf
          git commit -m "Add New Labour Codes 2026 Salary Guide PDF to repo" || echo "No changes to commit"
          git push
