name: Upload AI Listing Playbook to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reportlab
        run: pip install reportlab==5.0.1

      - name: Build PDF (deterministic)
        run: |
          mkdir -p downloads
          python3 products/ai-listing-playbook/build.py

      - name: Verify checksum
        run: |
          echo "c2cee03ecede165da6506bb94931f6d09d27194f93a615ae2ccfa570b5ca6ecf  downloads/ai-listing-playbook.pdf" | sha256sum -c

      - name: Attach PDF to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ai-listing-playbook-v1 downloads/ai-listing-playbook.pdf --repo shopshphereofficial-dev/digitalaikart --clobber

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/ai-listing-playbook.pdf
          git commit -m "Add AI Listing Playbook PDF to repo" || echo "No changes to commit"
          git push
