name: Upload AI Wedding and Event Planners Pack Cover to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download cover from release
        run: |
          mkdir -p products/ai-prompt-pack-indian-wedding-event-planners-2026
          gh release download ai-prompt-pack-indian-wedding-event-planners-2026-v1 --repo shopshphereofficial-dev/digitalaikart --pattern cover.jpg --output "products/ai-prompt-pack-indian-wedding-event-planners-2026/cover.jpg"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cover to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products/ai-prompt-pack-indian-wedding-event-planners-2026/cover.jpg
          git commit -m "Add AI Wedding and Event Planners Pack cover image to repo" || echo "No changes to commit"
          git push
