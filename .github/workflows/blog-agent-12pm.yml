name: AI blog agent (12 PM)

# Publishes one AI-news blog post a day at 12:00 PM IST.
# The article text is written by the blog agent (not by Gemini). This workflow
# uses the GEMINI_API_KEY repo secret ONLY to generate the cover image: it picks
# up any spec the agent dropped in blog/pending/ and renders + commits it.
on:
  schedule:
    - cron: "30 6 * * *"    # 12:00 PM IST
    - cron: "30 7 * * *"    # 1:00 PM IST (retry slot)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-agent-12pm
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Publish agent-written post (Gemini image only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/blog_image.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog assets/og feed.xml
          if git diff --cached --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "Auto blog: new AI news post (12 PM)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi
