name: Backfill blog cover images

# Gives older blog posts a natural, story-related cover image where they only had
# a flat inline SVG (or nothing). Idempotent — posts that already have a .jpg
# cover are skipped. Needs the GEMINI_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated post slugs to backfill (filename without .html)"
        type: string
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: backfill-images
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Backfill cover images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_SLUGS: ${{ github.event.inputs.slugs }}
        run: python3 tools/backfill_images.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog assets/og
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "Backfill natural cover images for recent blog posts"
            git push
          fi
