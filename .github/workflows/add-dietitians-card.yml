name: Add dietitians card to products listing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Insert product card
        run: |
          python3 - <<'PY'
          import io, sys, textwrap
          p = 'products/index.html'
          s = io.open(p, encoding='utf-8').read()
          slug = 'ai-prompt-pack-indian-dietitians-2026-27'
          if slug in s:
              print('card already present')
              sys.exit(0)
          raw = """
                    <div class="card">
                      <div class="card-img"><span class="card-badge">75% OFF</span><img src="/assets/og-default.png" alt="" loading="lazy" decoding="async"></div>
                      <div class="card-body">
                        <h3 class="card-title">The AI Prompt Pack for Indian Dietitians &amp; Nutritionists &mdash; 2026-27 Edition</h3>
                        <p class="card-desc">The 91-page, India-specific pack for registered dietitians, clinical nutritionists and qualified nutrition coaches: 120 copy-paste AI prompts across 10 parts &mdash; client onboarding and the red-flag triage, Indian meal-plan drafting for North, South, Bengali, Gujarati and Jain kitchens plus hostel mess food, shift work, festival weeks and a Rs 150-a-day plan, the whole GLP-1 client (protein-first eating for a small appetite, muscle protection, side-effect days, the off-medicine transition, prediabetes, fatty liver, PCOS and thyroid), WhatsApp retention from photo food logs to the renewal conversation, fourteen client handouts, a content engine, positioning and four-tier pricing, SOAP notes and consent, and ten fixes for when the output is wrong. Plus seven appendices: the verified 2026 India GLP-1 price table (from about Rs 1,290 to about Rs 13,000 a month after the 20 March patent expiry and the April price cut), the demand data (nutritionist searches up 48% pan-India year on year), an Indian food quick reference, reported subscription tiers, a 20-point pre-send checklist, a 90-day plan and a one-page cheat sheet. Every external figure dated and attributed, October 2026.</p>
                        <ul class="card-features">
                          <li>91 pages, 120 prompts, 10 parts</li>
                          <li>Verified 2026 India GLP-1 price table</li>
                          <li>Demand data: searches +48% pan-India, +106% Delhi</li>
                          <li>Indian food reference + pricing &amp; package sheet</li>
                          <li>20-point pre-send checklist + 90-day plan</li>
                        </ul>
                        <div class="price-row"><span class="price">&#8377;149</span><span class="price-old">&#8377;599</span><span class="price-label">one-time</span></div>
                        <a href="/products/ai-prompt-pack-indian-dietitians-2026-27/" class="btn btn-gold">View Details &rarr;</a>
                      </div>
                    </div>
                    """
          card = textwrap.dedent(raw)
          card = "\n".join(("  " + ln) if ln.strip() else ln for ln in card.split("\n"))
          marker = '<div class="coming-soon">'
          i = s.index(marker)
          s = s[:i] + card.rstrip() + "\n" + s[i:]
          io.open(p, 'w', encoding='utf-8').write(s)
          print('inserted card, new length', len(s))
          PY

      - name: Commit listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products/index.html
          git commit -m "New product: AI Prompt Pack for Indian Dietitians & Nutritionists - Rs 149" || echo "No changes to commit"
          git push
