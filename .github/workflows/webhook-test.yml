name: Razorpay webhook test

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: Supabase user id to credit
        required: true
      plan_id:
        description: Plan id (e.g. pack-small)
        required: false
        default: pack-small

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send a signed webhook
        env:
          WH_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          USER_ID: ${{ inputs.user_id }}
          PLAN_ID: ${{ inputs.plan_id }}
        run: |
          python3 - <<'PY'
          import hmac, hashlib, json, os, urllib.request

          secret = os.environ["WH_SECRET"].encode()
          body = json.dumps({
              "event": "payment.captured",
              "payload": {"payment": {"entity": {
                  "id": "pay_test_" + os.environ["USER_ID"][:8],
                  "notes": {"user_id": os.environ["USER_ID"], "plan_id": os.environ["PLAN_ID"]},
              }}},
          }, separators=(",", ":")).encode()

          sig = hmac.new(secret, body, hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              "https://guoxqlojsslwetlymbvj.supabase.co/functions/v1/razorpay-webhook",
              data=body,
              headers={"Content-Type": "application/json", "x-razorpay-signature": sig},
              method="POST")
          try:
              r = urllib.request.urlopen(req, timeout=60)
              print("HTTP", r.status)
              print(r.read().decode()[:500])
          except urllib.error.HTTPError as e:
              print("HTTP", e.code)
              print(e.read().decode()[:500])
          PY
