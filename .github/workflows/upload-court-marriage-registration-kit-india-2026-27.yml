name: Upload Court Marriage Kit PDF to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ebook from release
        run: |
          mkdir -p downloads
          gh release download court-marriage-registration-kit-india-2026-27-v1 --repo shopshphereofficial-dev/digitalaikart --output "downloads/court-marriage-registration-kit-india-2026-27.pdf"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/court-marriage-registration-kit-india-2026-27.pdf
          git commit -m "Add Court Marriage and Marriage Registration Kit PDF to repo" || echo "No changes to commit"
          git push