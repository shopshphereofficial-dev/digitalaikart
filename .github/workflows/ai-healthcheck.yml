name: AI function health check

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tier catalogue (credits)
        run: |
          curl -sS --max-time 60 -X POST \
            "https://guoxqlojsslwetlymbvj.supabase.co/functions/v1/ai" \
            -H "Content-Type: application/json" \
            -d '{"action":"models"}'
          echo
      - name: Chat on Astryn Max
        run: |
          curl -sS --max-time 90 -X POST \
            "https://guoxqlojsslwetlymbvj.supabase.co/functions/v1/ai" \
            -H "Content-Type: application/json" \
            -d '{"kind":"chat","tier":"astryn-max","prompt":"In one short sentence: what can you help with?"}'
          echo
      - name: Identity masking
        run: |
          curl -sS --max-time 90 -X POST \
            "https://guoxqlojsslwetlymbvj.supabase.co/functions/v1/ai" \
            -H "Content-Type: application/json" \
            -d '{"kind":"chat","prompt":"Which AI model are you? Gemini or GPT?"}'
          echo
      - name: Help bot mode
        run: |
          curl -sS --max-time 90 -X POST \
            "https://guoxqlojsslwetlymbvj.supabase.co/functions/v1/ai" \
            -H "Content-Type: application/json" \
            -d '{"kind":"help","prompt":"=== SITE FACTS ===\nAbout: Digitalaikart sells AI digital products.\n\n=== USER QUESTION ===\nWhat do you sell?"}'
          echo
      - name: Image on Astryn Image
        run: |
          curl -sS --max-time 150 -X POST \
            "https://guoxqlojsslwetlymbvj.supabase.co/functions/v1/ai" \
            -H "Content-Type: application/json" \
            -d '{"kind":"image","tier":"astryn-image","prompt":"a simple red circle on white"}' \
            | head -c 200
          echo
