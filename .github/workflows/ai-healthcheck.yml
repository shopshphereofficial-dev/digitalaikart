name: AI function health check

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Google login enabled?
        run: |
          echo "--- supabase auth settings ---"
          curl -sS --max-time 60 \
            "https://guoxqlojsslwetlymbvj.supabase.co/auth/v1/settings" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1b3hxbG9qc3Nsd2V0bHltYnZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NzQyMDQsImV4cCI6MjEwNzU1MDIwNH0.iSDgjCsyEjKaawt6RKdYPpivqnVCCvwQcR45KCBgsqU" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); ext=d.get('external',{}); print('external providers:', {k:v for k,v in ext.items() if v}); print('GOOGLE ENABLED:', ext.get('google', False))"
          echo
      - name: Does Google sign-in start?
        run: |
          echo "--- oauth redirect (expect 302 to accounts.google.com) ---"
          curl -sS -o /dev/null -w "HTTP %{http_code}  ->  %{redirect_url}\n" --max-time 60 \
            "https://guoxqlojsslwetlymbvj.supabase.co/auth/v1/authorize?provider=google" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1b3hxbG9qc3Nsd2V0bHltYnZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NzQyMDQsImV4cCI6MjEwNzU1MDIwNH0.iSDgjCsyEjKaawt6RKdYPpivqnVCCvwQcR45KCBgsqU"
          echo
      - name: Chat still works
        run: |
          curl -sS --max-time 90 -X POST \
            "https://guoxqlojsslwetlymbvj.supabase.co/functions/v1/ai" \
            -H "Content-Type: application/json" \
            -d '{"kind":"chat","prompt":"Reply with exactly: ok"}'
          echo
