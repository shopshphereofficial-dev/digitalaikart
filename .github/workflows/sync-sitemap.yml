name: Sync sitemap

# Keeps sitemap.xml current so every new blog / product / app page is discoverable
# by Google. Runs whenever a product, blog post or the sync script changes.
on:
  push:
    branches: [main]
    paths:
      - "tools/sync_sitemap.py"
      - ".github/workflows/sync-sitemap.yml"
      - "products.json"
      - "products/**"
      - "blog/**"
      - "apps/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sitemap
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sync sitemap.xml
        run: python3 tools/sync_sitemap.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "sitemap already up to date"
          else
            git commit -m "Sync sitemap.xml with new pages"
            git push
          fi
