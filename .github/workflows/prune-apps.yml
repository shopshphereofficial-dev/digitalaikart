name: Prune apps (keep Neon Calculator only)

# Withdraws every app that is not ready for review: their pages, icons, social
# images, catalogue rows, homepage cards, sitemap entries and the rows they had
# in the app privacy policy. Neon Calculator stays, with its own details block.
# Safe to re-run — tools/prune_apps.py is idempotent.

on:
  push:
    branches: [main]
    paths:
      - "tools/prune_apps.py"
      - ".github/workflows/prune-apps.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prune-apps
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prune apps
        run: python3 tools/prune_apps.py .

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to change — only Neon Calculator is already listed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apps: withdraw all apps except Neon Calculator for Play review"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
