name: Publish UK playbook

on:
  push:
    branches: [main]
    paths:
      - "pdf-src/uk-student-visa-graduate-route-playbook-2027/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab==5.1.0 pypdf
      - run: python pdf-src/uk-student-visa-graduate-route-playbook-2027/run_publish.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: publish UK study visa playbook 2027"
          git push
