name: Newsletter signup

# Puts the Tally signup section on the homepage, every product page and every blog
# post, plus a fallback in assets/effects.js for pages added later. Idempotent.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Add newsletter signup
        run: python3 tools/add_newsletter.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to change"
          else
            git commit -m "Add Tally newsletter signup to every page"
            git pull --rebase origin main
            git push
          fi
