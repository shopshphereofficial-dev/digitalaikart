name: Publish Smart Credit Card Playbook 2026 PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --quiet "reportlab==5.0.1"
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core || true

      - name: Build the PDF
        run: |
          mkdir -p downloads
          PDF_OUT="downloads/smart-credit-card-playbook-2026.pdf" python tools/build_smart_credit_card_playbook_2026.py
          ls -l downloads/smart-credit-card-playbook-2026.pdf

      - name: Commit PDF to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/smart-credit-card-playbook-2026.pdf
          git commit -m "Add Smart Credit Card Playbook 2026 PDF to repo" || echo "No changes to commit"
          git push
