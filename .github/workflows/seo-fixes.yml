name: SEO fixes

# One-off, idempotent site-wide SEO pass: loads analytics on every page, makes the
# homepage H1 descriptive, adds the small CSS rules, shortens over-long titles and
# normalises "Rs. 149" to the rupee sign on product pages.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-fixes
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply SEO fixes
        run: python3 tools/site_seo_fixes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to change"
          else
            git commit -m "SEO: analytics, homepage H1, shorter titles, currency"
            git pull --rebase origin main
            git push
          fi
