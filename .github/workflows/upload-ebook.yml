name: Upload Ebook to Repo

on:
  push:
    paths:
      - '.github/workflows/upload-ebook.yml'

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ebook from release
        run: |
          gh release download ebook-v1 --repo shopshphereofficial-dev/digitalaikart --output "GPT6_Astra_Zero_to_Hero_Guide_FINAL.pdf"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GPT6_Astra_Zero_to_Hero_Guide_FINAL.pdf
          git commit -m "Add ebook PDF to repo" || echo "No changes to commit"
          git push