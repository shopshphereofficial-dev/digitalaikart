name: AI blog agent (5 PM)

# Publishes the queued AI-news post (written by the agent) at 5:00 PM IST.
# Gemini is used ONLY for the cover image. If nothing is queued the run does
# nothing. Also refreshes sitemap.xml in the same commit.
on:
  schedule:
    - cron: "30 11 * * *"   # 5:00 PM IST
    - cron: "30 12 * * *"   # 6:00 PM IST (retry slot)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-agent-5pm
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Publish queued post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/publish_queued.py
      - name: Sync sitemap
        run: python3 tools/sync_sitemap.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog assets/og feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "Auto blog: publish queued AI news post (5 PM)"
            git pull --rebase origin main
            git push
          fi
