name: Upload ICSE 2027 90-Day Board Plan to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ebook from release
        run: |
          mkdir -p downloads
          gh release download icse-2027-90-day-board-plan-v1 --repo shopshphereofficial-dev/digitalaikart --output "downloads/icse-2027-90-day-board-plan.pdf"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/icse-2027-90-day-board-plan.pdf
          git commit -m "Add ICSE 2027 90-Day Board Plan PDF to repo" || echo "No changes to commit"
          git push
