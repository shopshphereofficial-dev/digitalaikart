name: Assemble NEET 2027 PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: |
          mkdir -p /scratch/work
          cat .build-src/neet-build.part* > /scratch/work/build_neet_handbook.py
          sha256sum /scratch/work/build_neet_handbook.py
          python3 /scratch/work/build_neet_handbook.py
          cp /scratch/work/neet-2027-starter-handbook.pdf downloads/neet-2027-starter-handbook.pdf
          ls -la downloads/neet-2027-starter-handbook.pdf
          rm -rf .build-src .github/workflows/assemble-neet-pdf.yml
          git config user.name "shopshphereofficial-dev"
          git config user.email "shopshphereofficial@gmail.com"
          git add -A
          git commit -m "Assemble NEET 2027 Starter Handbook PDF"
          git push
