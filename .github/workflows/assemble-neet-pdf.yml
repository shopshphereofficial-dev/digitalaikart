name: Assemble NEET 2027 PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: |
          WORK="$RUNNER_TEMP/work"
          mkdir -p "$WORK"
          cat .build-src/neet-build.part* > "$WORK/build_neet_handbook.py"
          sed -i "s|/scratch/work|$WORK|g" "$WORK/build_neet_handbook.py"
          sha256sum "$WORK/build_neet_handbook.py"
          python3 "$WORK/build_neet_handbook.py"
          cp "$WORK/neet-2027-starter-handbook.pdf" downloads/neet-2027-starter-handbook.pdf
          ls -la downloads/neet-2027-starter-handbook.pdf
          rm -rf .build-src .github/workflows/assemble-neet-pdf.yml
          git config user.name "shopshphereofficial-dev"
          git config user.email "shopshphereofficial@gmail.com"
          git add -A
          git commit -m "Assemble NEET 2027 Starter Handbook PDF"
          git push
