name: Upload AI HR & Recruitment Playbook to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ebook from release
        run: |
          mkdir -p downloads
          gh release download ai-hr-recruitment-playbook-2026-v1 --repo shopshphereofficial-dev/digitalaikart --output "downloads/ai-hr-recruitment-playbook-2026.pdf"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/ai-hr-recruitment-playbook-2026.pdf
          git commit -m "Add AI HR & Recruitment Playbook PDF to repo" || echo "No changes to commit"
          git pull --rebase origin main
          git push
