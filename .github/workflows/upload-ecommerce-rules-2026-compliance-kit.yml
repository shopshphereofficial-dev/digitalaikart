name: Upload E-Commerce Rules 2026 Compliance Kit to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ebook from release
        run: |
          mkdir -p downloads
          gh release download ecommerce-rules-2026-compliance-kit-v1 --repo shopshphereofficial-dev/digitalaikart --output "downloads/ecommerce-rules-2026-compliance-kit.pdf"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/ecommerce-rules-2026-compliance-kit.pdf
          git commit -m "Add E-Commerce Rules 2026 Compliance Kit PDF to repo" || echo "No changes to commit"
          git push
