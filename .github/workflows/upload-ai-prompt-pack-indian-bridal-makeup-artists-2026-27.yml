name: Upload AI Prompt Pack for Indian Bridal Makeup Artists to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ebook and cover from release
        run: |
          mkdir -p downloads
          mkdir -p products/ai-prompt-pack-indian-bridal-makeup-artists-2026-27
          gh release download ai-prompt-pack-indian-bridal-makeup-artists-2026-27-v1 --repo shopshphereofficial-dev/digitalaikart --pattern "ai-prompt-pack-indian-bridal-makeup-artists-2026-27.pdf" --output "downloads/ai-prompt-pack-indian-bridal-makeup-artists-2026-27.pdf"
          gh release download ai-prompt-pack-indian-bridal-makeup-artists-2026-27-v1 --repo shopshphereofficial-dev/digitalaikart --pattern "cover.jpg" --output "products/ai-prompt-pack-indian-bridal-makeup-artists-2026-27/cover.jpg"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ebook and cover to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/ai-prompt-pack-indian-bridal-makeup-artists-2026-27.pdf products/ai-prompt-pack-indian-bridal-makeup-artists-2026-27/cover.jpg
          git commit -m "Add AI Prompt Pack for Indian Bridal Makeup Artists PDF and cover to repo" || echo "No changes to commit"
          git push
