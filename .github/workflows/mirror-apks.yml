name: Mirror app APKs onto the site

# Copies each app's latest built APK from its GitHub release into /apps/apk/,
# so downloads are served from digitalkartai.shop itself (one tap, no redirect).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"   # daily
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-apks.yml"

permissions:
  contents: write

concurrency:
  group: mirror-apks
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest APKs
        run: |
          mkdir -p apps/apk
          # slug -> app repo
          cat > /tmp/map.txt <<'EOF'
          neon-calculator neon-calculator
          neon-piano neon-piano-android
          car-simulator car-simulator-android
          grabit grabit
          soulstream soulstream
          omnitask-ai omnitask-ai
          pulsechat pulsechat
          twinspace twinspace
          python-king python-king
          voltaura voltaura
          media-vault media-vault
          EOF
          while read slug repo; do
            [ -z "$slug" ] && continue
            url="https://github.com/shopshphereofficial-dev/${repo}/releases/latest/download/app.apk"
            if curl -fsSL --retry 3 "$url" -o "apps/apk/${slug}.apk"; then
              echo "mirrored ${slug} ($(du -h "apps/apk/${slug}.apk" | cut -f1))"
            else
              rm -f "apps/apk/${slug}.apk"
              echo "skipped ${slug} (no app.apk in latest release)"
            fi
          done < /tmp/map.txt

      - name: Commit mirrored APKs
        run: |
          if [ -z "$(git status --porcelain apps/apk)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/apk
          git commit -m "chore: mirror app APKs for on-site downloads"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
