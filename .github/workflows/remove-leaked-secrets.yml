name: Remove leaked secrets

# Emergency, one-off: strips the hardcoded GitHub token and Gemini key out of the
# public ai/auth.js and assets/helpbot.js. Idempotent.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-leaked-secrets
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Strip secrets
        run: python3 tools/remove_leaked_secrets.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ai assets
          if git diff --cached --quiet; then
            echo "nothing to change"
          else
            git commit -m "Security: remove hardcoded credentials from public files"
            git pull --rebase origin main
            git push
          fi
