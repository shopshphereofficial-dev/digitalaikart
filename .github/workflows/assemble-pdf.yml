name: Assemble PDF
on:
  push:
    paths: ['.github/workflows/assemble-pdf.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify
        run: |
          set -e
          pip install --quiet reportlab==5.0.1 pypdf
          cat $(ls pdf-build/part-*.py | sort) > build.py
          python build.py
          echo "e0e131722567e5e0aa5b4754b68ccb90  festive-seller-playbook-2026.pdf" | md5sum -c -
          python -c "from pypdf import PdfReader; r = PdfReader('festive-seller-playbook-2026.pdf'); assert len(r.pages) == 30, len(r.pages); print('pages OK: 30')"
      - name: Publish and clean up
        run: |
          set -e
          mkdir -p downloads
          cp festive-seller-playbook-2026.pdf downloads/festive-seller-playbook-2026.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q pdf-build
          git rm -r -q pdf-parts || true
          git rm -q .github/workflows/assemble-pdf.yml
          git add downloads/festive-seller-playbook-2026.pdf
          git commit -m "Publish full Festive Seller Playbook 2026 PDF [skip ci]"
          git push
