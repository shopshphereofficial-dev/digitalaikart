name: Publish The Term Life Insurance Buying Guide 2026 PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-ebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ebook from release
        run: |
          mkdir -p downloads
          gh release download term-life-insurance-buying-guide-2026-v1 --repo shopshphereofficial-dev/digitalaikart --output "downloads/term-life-insurance-buying-guide-2026.pdf"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ebook to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/term-life-insurance-buying-guide-2026.pdf
          git commit -m "Add The Term Life Insurance Buying Guide 2026 PDF to repo" || echo "No changes to commit"
          git push
