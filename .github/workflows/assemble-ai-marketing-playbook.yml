name: Assemble AI Marketing Playbook PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble PDF from verified parts
        run: |
          cat .github/pdf-parts/ai-marketing-playbook.part*.txt | tr -d '[:space:]' | base64 -d | gunzip > ai-marketing-playbook.pdf
          test "$(md5sum ai-marketing-playbook.pdf | cut -d' ' -f1)" = "553e8a4606a66506d80bd8781fac1e74" || (echo 'MD5 mismatch'; exit 1)
          test "$(wc -c < ai-marketing-playbook.pdf)" = "772034" || (echo 'Byte count mismatch'; exit 1)
          mkdir -p downloads
          mv ai-marketing-playbook.pdf downloads/
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ai-marketing-playbook.pdf
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish AI Marketing Playbook PDF to repo"
            git push
          fi
