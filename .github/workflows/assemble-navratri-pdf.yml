name: Assemble Navratri 2026 Complete Home Guide PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Assemble PDF from verified parts
        run: |
          cat .github/pdf-parts/navratri-2026-complete-guide.part*.txt | tr -d '\n' | base64 -d > navratri-2026-complete-guide.pdf
          test "$(md5sum navratri-2026-complete-guide.pdf | cut -d' ' -f1)" = "4645d8c4ca829cca082031d5ffdfd01c" || (echo 'MD5 mismatch'; exit 1)
          test "$(wc -c < navratri-2026-complete-guide.pdf)" = "84933" || (echo 'Byte count mismatch'; exit 1)
          mkdir -p downloads
          mv navratri-2026-complete-guide.pdf downloads/

      - name: Commit PDF to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/navratri-2026-complete-guide.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Navratri 2026 Complete Home Guide PDF"
            git push
          fi
