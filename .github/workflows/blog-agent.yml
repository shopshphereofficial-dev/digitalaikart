name: AI blog agent

# Publishes one AI-news blog post a day (cover image + sources + ads), at
# 06:00 IST. Needs the GEMINI_API_KEY repository secret.
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate today's AI news post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/blog_agent.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog assets/og feed.xml
          if git diff --cached --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "Auto blog: new AI news post"
            git push
          fi
