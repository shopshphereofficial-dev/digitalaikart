name: AI blog agent

# Publishes one AI-news blog post a day at 6:00 AM IST.
# This slot writes its own article with Gemini (text) AND makes the cover image
# with Gemini, so it never depends on any agent being awake. Three morning slots
# so a delayed schedule still gets today's post out; the script no-ops if today's
# post already exists. Also refreshes sitemap.xml in the same commit.
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
    - cron: "30 1 * * *"   # 07:00 IST (retry slot)
    - cron: "30 2 * * *"   # 08:00 IST (retry slot)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-generate today's post from scratch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Generate today's AI news post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_TODAY: ${{ (github.event.inputs.force == 'true') && '1' || '' }}
        run: python3 tools/blog_agent.py
      - name: Sync sitemap
        run: python3 tools/sync_sitemap.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blog assets/og feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "Auto blog: new AI news post (6 AM)"
            git pull --rebase origin main
            git push
          fi
