name: Fix product cards

# Puts back the missing <div class="card"> wrapper on 95 cards of the products
# listing (they had stray </div> tags and rendered without card styling).
# Safe to re-run — tools/fix_product_cards.py is idempotent and refuses to save
# an unbalanced page.

on:
  push:
    branches: [main]
    paths:
      - "tools/fix_product_cards.py"
      - ".github/workflows/fix-product-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-product-cards
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair card wrappers
        run: python3 tools/fix_product_cards.py .

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore missing card wrappers on the products listing"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
